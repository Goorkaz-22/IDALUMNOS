
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identificador de Alumnos</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #0f172a;
    color: white;
    min-height: 100vh;
    padding: 30px 15px;
}

.container {
    max-width: 750px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

header h1 {
    font-size: 27px;
    margin-bottom: 10px;
}

header p {
    color: #94a3b8;
}

.panel {
    background: #1e293b;
    padding: 25px;
    border-radius: 16px;
    border: 1px solid #334155;
}

.upload {
    text-align: center;
    padding: 25px;
    border: 2px dashed #475569;
    border-radius: 12px;
    margin-bottom: 25px;
}

button, .upload label {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:hover, .upload label:hover {
    background: #1d4ed8;
}

input[type=file] {
    display: none;
}

.viewer {
    display: none;
}

.progress {
    display: flex;
    justify-content: space-between;
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 12px;
}

.progress-bar {
    height: 7px;
    background: #334155;
    border-radius: 10px;
    margin-bottom: 25px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: #3b82f6;
    width: 0%;
}

.photo {
    background: #0f172a;
    height: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;
}

.photo img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.photo-name {
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 20px;
}

label.field-label {
    display: block;
    margin-bottom: 10px;
    font-weight: bold;
}

.name-input {
    width: 100%;
    padding: 14px;
    background: #0f172a;
    border: 1px solid #475569;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    margin-bottom: 20px;
}

.navigation {
    display: flex;
    gap: 10px;
    justify-content: space-between;
}

.navigation button {
    flex: 1;
}

.secondary {
    background: #475569;
}

.unknown {
    background: #b45309;
}

.status {
    text-align: center;
    color: #94a3b8;
    margin-top: 20px;
    font-size: 13px;
}

@media(max-width: 500px) {
    .photo {
        height: 300px;
    }

    .navigation button {
        padding: 12px 8px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>📸 Identificador de Alumnos</h1>
    <p>Sistema de identificación por promociones</p>
</header>

<div class="panel">

    <div class="upload">
        <p style="margin-bottom:20px;color:#94a3b8">
            Selecciona la carpeta de fotografías
        </p>

        <label for="folderInput">📁 Cargar carpeta</label>

        <input
            type="file"
            id="folderInput"
            webkitdirectory
            multiple
            accept="image/*"
        >
    </div>

    <div class="viewer" id="viewer">

        <div class="progress">
            <span>Progreso</span>
            <span id="counter">0 / 0</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="photo">
            <img id="studentPhoto" alt="Fotografía del alumno">
        </div>

        <div class="photo-name" id="photoName"></div>

        <label class="field-label" for="studentName">
            Nombre del alumno
        </label>

        <input
            type="text"
            id="studentName"
            class="name-input"
            placeholder="Escribe el nombre del alumno..."
            autocomplete="off"
        >

        <div class="navigation">
            <button class="secondary" onclick="previousPhoto()">
                ← Anterior
            </button>

            <button class="unknown" onclick="markUnknown()">
                No lo identifico
            </button>

            <button onclick="nextPhoto()">
                Siguiente →
            </button>
        </div>

        <div class="status" id="status"></div>

    </div>

</div>
</div>

<script>
let photos = [];
let currentIndex = 0;
let answers = {};

const folderInput = document.getElementById("folderInput");
const viewer = document.getElementById("viewer");

folderInput.addEventListener("change", function() {

    photos = Array.from(this.files)
        .filter(file => file.type.startsWith("image/"))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, {
            numeric: true
        }));

    if (photos.length === 0) {
        alert("No se encontraron fotografías.");
        return;
    }

    currentIndex = 0;
    answers = {};

    viewer.style.display = "block";

    showPhoto();
});

function showPhoto() {

    const photo = photos[currentIndex];

    document.getElementById("studentPhoto").src =
        URL.createObjectURL(photo);

    document.getElementById("photoName").textContent =
        photo.name;

    document.getElementById("studentName").value =
        answers[currentIndex]?.name || "";

    document.getElementById("counter").textContent =
        `${currentIndex + 1} / ${photos.length}`;

    document.getElementById("progressFill").style.width =
        `${((currentIndex + 1) / photos.length) * 100}%`;

    document.getElementById("status").textContent =
        answers[currentIndex]?.unknown
        ? "Marcado como no identificado"
        : "";
}

function saveAnswer() {

    const name = document.getElementById("studentName").value.trim();

    if (name) {
        answers[currentIndex] = {
            name: name,
            unknown: false
        };
    } else if (!answers[currentIndex]?.unknown) {
        delete answers[currentIndex];
    }
}

function nextPhoto() {

    saveAnswer();

    if (currentIndex < photos.length - 1) {
        currentIndex++;
        showPhoto();
    } else {
        document.getElementById("status").textContent =
            "¡Llegaste a la última fotografía!";
    }
}

function previousPhoto() {

    saveAnswer();

    if (currentIndex > 0) {
        currentIndex--;
        showPhoto();
    }
}

function markUnknown() {

    answers[currentIndex] = {
        name: "",
        unknown: true
    };

    nextPhotoWithoutSaving();
}

function nextPhotoWithoutSaving() {

    if (currentIndex < photos.length - 1) {
        currentIndex++;
        showPhoto();
    } else {
        document.getElementById("status").textContent =
            "¡Llegaste a la última fotografía!";
    }
}
</script>

</body>
</html>
